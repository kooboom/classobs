# classobs — 앱 폴더를 Apache가 직접 내보내지 못하게 막는다 (서버 전체 설정)
#
# 앱 폴더 /home/app/public_html/classobs 는 문서 루트(public_html) 안에 있다.
# 프록시(apache-classobs.conf)가 잡히는 동안에는 /classobs 요청이 전부 Node로 가므로 문제없다.
# 하지만 프록시가 빠진 곳 — 모듈이 꺼졌거나, Include를 넣지 않은 VirtualHost(80 포트, IP로 들어오는
# 기본 사이트 등) — 에서는 Apache가 이 폴더를 파일 그대로 내보낸다. 그러면
#   /classobs/data/submissions/1234.json   학생 이름·점수·근거
#   /classobs/.git/                        저장소
#   /classobs/server.js, node_modules/     서버 코드
# 가 누구에게나 보인다. public/ 만의 문제가 아니다.
#
# 이 블록은 파일로 내보내는 것만 막는다. 프록시 요청은 파일 경로를 거치지 않으므로 앱은 그대로 동작한다.
#
# 적용: VirtualHost 안이 아니라 서버 전체에 건다 — 그래야 Include를 빠뜨린 사이트까지 막힌다.
#   sudo cp deploy/apache-classobs-deny.conf /etc/apache2/conf-available/classobs-deny.conf
#   sudo a2enconf classobs-deny
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# 앱 폴더를 옮기면 아래 경로도 같이 바꾼다 (심볼릭 링크가 아닌 실제 경로).

<Directory "/home/app/public_html/classobs">
    Require all denied
</Directory>
