# classobs — CLASS 관찰 실습 앱
# app.koowoo.kr/classobs 전체를 같은 서버의 Node(127.0.0.1:3003)로 넘긴다.
# 브라우저는 Apache 하나만 보므로 CORS 설정도, 3003 포트 개방도 필요 없다.
#
# 적용 방법은 README.md의 "Apache 연결"을 따른다. 요약:
#   1) 이 파일을 /etc/apache2/conf-available/classobs.conf 로 복사
#   2) app.koowoo.kr 의 <VirtualHost> 블록(443, 그리고 80을 쓰면 80에도) 안에
#        Include conf-available/classobs.conf
#      한 줄을 넣는다. 같은 블록에 "ProxyPass /" 처럼 전체를 넘기는 줄이 있으면 그보다 위에 넣는다.
#   3) sudo a2enmod proxy proxy_http && sudo apachectl configtest && sudo systemctl reload apache2
#
# 이것만으로는 부족하다. 앱 폴더가 문서 루트(public_html) 안에 있으므로, 이 Include 가 없는 사이트에서는
# 폴더가 파일로 노출된다(data/ 학생 기록 포함). apache-classobs-deny.conf 를 서버 전체에 함께 건다.
#
# 주의: 앞뒤 경로의 끝 슬래시를 맞춰 둔 것이다. 한쪽에만 / 를 붙이지 말 것.

ProxyPass        /classobs  http://127.0.0.1:3003/classobs
ProxyPassReverse /classobs  http://127.0.0.1:3003/classobs
